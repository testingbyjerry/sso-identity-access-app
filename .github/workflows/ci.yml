name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

  test-database-and-backend:
    name: Backend & Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: sso_iam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/sso_iam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_ci_password
      POSTGRES_DB: sso_iam
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      PORT: 3000
      HOST: 127.0.0.1
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      COOKIE_SECRET: ci_test_cookie_secret_key_minimum_32_characters_long
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters_long
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:5173

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Database Migrations
        run: pnpm db:migrate

      - name: Seed Database
        run: pnpm db:seed

      - name: Run Database Tests (RLS & Tenant Isolation)
        run: pnpm --filter @sso/database test

      - name: Run API Security & Route Integration Tests
        run: pnpm --filter @sso/api test

  test-frontend-and-e2e:
    name: Frontend Unit & Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Unit & Component Tests
        run: pnpm --filter @sso/web test

      - name: Install Playwright Browsers
        run: pnpm --filter @sso/web exec playwright install --with-deps chromium

      - name: Run Playwright End-to-End Suite
        run: pnpm test:e2e

  build-monorepo:
    name: Production Build Verification
    needs: [lint-and-typecheck, test-database-and-backend, test-frontend-and-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Monorepo Packages and Apps
        run: pnpm build
