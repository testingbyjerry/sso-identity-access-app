services:
  postgres:
    image: postgres:16-alpine
    container_name: sso_iam_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-sso_iam}
    volumes:
      - sso_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sso_iam}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sso_prod_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sso_iam_prod_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_prod_secure_password_123}@postgres:5432/${POSTGRES_DB:-sso_iam}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
      COOKIE_SECRET: ${COOKIE_SECRET:-prod_super_secret_cookie_signing_key_min_32_chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      APP_URL: ${APP_URL:-http://localhost}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60000}
    expose:
      - '3000'
    networks:
      - sso_prod_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: sso_iam_prod_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${PROD_PORT:-80}:80'
    networks:
      - sso_prod_network

volumes:
  sso_prod_postgres_data:
    name: sso_iam_prod_postgres_data

networks:
  sso_prod_network:
    name: sso_iam_prod_network
    driver: bridge
